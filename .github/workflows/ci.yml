name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODEL_DIR: distilbert/distilbert-base-uncased-finetuned-sst-2-english
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers fastapi uvicorn pydantic httpx pytest ruff

      - name: Lint
        run: ruff check app.py test_app.py

      - name: Test
        run: pytest -v
